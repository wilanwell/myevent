# MyEvent continuous integration.
#   lint + unit/integration tests (PHPUnit, MariaDB)  on every push and pull request
#   end-to-end HTTP checks (Apache + .htaccess)        after the tests pass
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: myevent_test
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, openssl, fileinfo, zlib
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP files
        run: php tools/lint.php

      - name: Every interface string has a Malay translation
        run: php tools/i18n.php

      - name: Unit and integration tests
        run: vendor/bin/phpunit

  e2e:
    name: End-to-end (Apache)
    needs: test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: myevent
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, openssl, fileinfo, zlib
          coverage: none

      - name: Load schema and demo data
        run: |
          mysql -h127.0.0.1 -uroot -proot myevent < database/schema.sql
          mysql -h127.0.0.1 -uroot -proot myevent < database/seed.sql

      - name: Write .env
        run: |
          cat > .env <<EOF
          APP_URL=http://localhost/myevent
          APP_DEBUG=false
          APP_TIMEZONE=Asia/Kuala_Lumpur
          APP_KEY=$(php -r 'echo bin2hex(random_bytes(32));')
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=myevent
          DB_USERNAME=root
          DB_PASSWORD=root
          MAIL_DRIVER=log
          MAIL_FROM=no-reply@myevent.example
          EOF
          chmod -R a+rwX storage uploads

      # The official PHP image with Apache, sharing the runner's network so it reaches
      # MariaDB on 127.0.0.1 and serves http://localhost/myevent with .htaccess enabled.
      - name: Start Apache + PHP
        run: |
          docker run -d --name web --network host -v "$PWD:/var/www/html/myevent" php:8.2-apache \
            bash -c "docker-php-ext-install mysqli >/dev/null \
              && a2enmod rewrite headers expires deflate >/dev/null \
              && sed -ri 's/AllowOverride None/AllowOverride All/' /etc/apache2/apache2.conf \
              && apache2-foreground"
          for i in $(seq 1 60); do
            curl -fs http://localhost/myevent/health.php && break
            sleep 2
          done
          curl -fsS http://localhost/myevent/health.php

      - name: End-to-end checks
        env:
          BASE: http://localhost/myevent
          MYSQL: mysql
          MYSQL_OPTS: -h127.0.0.1 -uroot -proot
          DB: myevent
          PHP: php
        run: bash tests/e2e.sh

      - name: Apache log
        if: failure()
        run: |
          docker logs web | tail -100
          tail -100 storage/logs/php-error.log 2>/dev/null || true
